[pytest]
asyncio_mode = auto

markers =
    ui: UI tests (Playwright)
    api: API tests
    smoke: Smoke suite
    regression: Regression suite

addopts =
    --strict-markers
    --tb=short
    -ra
    --alluredir=allure-results

log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
